<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="25" y="20" width="900" height="70" rx="10" fill="url(#headerGrad)" filter="url(#shadow)" />
  <text x="50" y="55" fill="#ffffff" font-size="20" font-weight="700">Intelligent Document Extraction, Validation &amp; API Platform</text>
  <text x="50" y="75" fill="#94a3b8" font-size="12">End-to-End System Architecture &bull; Candidate Technical Case Study</text>

  <!-- 1. Client Layer -->
  <g transform="translate(40, 115)">
    <rect width="250" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="250" height="35" rx="8" fill="#e2e8f0"/>
    <text x="20" y="23" fill="#334155" font-size="13" font-weight="700">CLIENT LAYER (FRONTEND / API)</text>
    
    <rect x="15" y="50" width="220" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="75" fill="#0f172a" font-size="12" font-weight="600">Web Dashboard (HTML / CSS / JS)</text>

    <rect x="15" y="105" width="220" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="130" fill="#0f172a" font-size="12" font-weight="600">REST API Clients (cURL / Python / JS)</text>

    <rect x="15" y="160" width="220" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="185" fill="#0f172a" font-size="12" font-weight="600">OpenAPI / Swagger UI (/docs)</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 290 225 L 340 225" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="295" y="215" fill="#2563eb" font-size="10" font-weight="600">Multipart</text>

  <!-- 2. API Gateway & Controller Layer -->
  <g transform="translate(350, 115)">
    <rect width="260" height="520" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="260" height="35" rx="8" fill="#dbeafe"/>
    <text x="20" y="23" fill="#1e40af" font-size="13" font-weight="700">CORE PROCESSING PIPELINE</text>

    <!-- Step 1: Input Validation -->
    <rect x="15" y="50" width="230" height="60" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="25" y="72" fill="#1e3a8a" font-size="12" font-weight="700">1. Input &amp; File Validation</text>
    <text x="25" y="92" fill="#64748b" font-size="10">MIME check, corruption test, ≤3 pages limit</text>

    <!-- Down arrow -->
    <line x1="130" y1="110" x2="130" y2="135" stroke="#94a3b8" stroke-width="2"/>

    <!-- Step 2: OCR / Text Extraction -->
    <rect x="15" y="140" width="230" height="60" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="25" y="162" fill="#1e3a8a" font-size="12" font-weight="700">2. OCR &amp; Text Extraction</text>
    <text x="25" y="182" fill="#64748b" font-size="10">PyPDF / PyMuPDF + Tesseract Fallback</text>

    <!-- Down arrow -->
    <line x1="130" y1="200" x2="130" y2="225" stroke="#94a3b8" stroke-width="2"/>

    <!-- Step 3: AI Extraction -->
    <rect x="15" y="230" width="230" height="65" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="25" y="252" fill="#1e3a8a" font-size="12" font-weight="700">3. Field &amp; Table Extraction</text>
    <text x="25" y="272" fill="#64748b" font-size="10">Gemini/OpenAI Multimodal + Heuristics</text>
    <text x="25" y="285" fill="#64748b" font-size="10">Extracts values, confidence &amp; grounding</text>

    <!-- Down arrow -->
    <line x1="130" y1="295" x2="130" y2="320" stroke="#94a3b8" stroke-width="2"/>

    <!-- Step 4: Financial Validation -->
    <rect x="15" y="325" width="230" height="75" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="25" y="347" fill="#1e3a8a" font-size="12" font-weight="700">4. Financial Validation Engine</text>
    <text x="25" y="367" fill="#64748b" font-size="10">Invoice math, Balance Sheet eq, P&amp;L</text>
    <text x="25" y="382" fill="#64748b" font-size="10">Cash Flow checks, numerical tolerance</text>

    <!-- Down arrow -->
    <line x1="130" y1="400" x2="130" y2="425" stroke="#94a3b8" stroke-width="2"/>

    <!-- Step 5: JSON Formatting -->
    <rect x="15" y="430" width="230" height="60" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="25" y="452" fill="#1e3a8a" font-size="12" font-weight="700">5. Structured JSON Output</text>
    <text x="25" y="472" fill="#64748b" font-size="10">Standardized Section 5.2 Response Schema</text>
  </g>

  <!-- Arrow to Services / DB -->
  <line x1="610" y1="262" x2="665" y2="262" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="610" y1="460" x2="665" y2="460" stroke="#2563eb" stroke-width="2.5"/>

  <!-- 3. AI & External Services Layer -->
  <g transform="translate(670, 115)">
    <rect width="240" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="240" height="35" rx="8" fill="#fef3c7"/>
    <text x="15" y="23" fill="#92400e" font-size="13" font-weight="700">AI &amp; OCR ENGINE PROVIDERS</text>

    <rect x="15" y="50" width="210" height="45" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="25" y="70" fill="#0f172a" font-size="11" font-weight="600">Google Gemini 2.5/1.5 Flash</text>
    <text x="25" y="85" fill="#64748b" font-size="9">Multimodal Vision &amp; Structured JSON</text>

    <rect x="15" y="105" width="210" height="45" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="25" y="125" fill="#0f172a" font-size="11" font-weight="600">OpenAI GPT-4o / GPT-4o-mini</text>
    <text x="25" y="140" fill="#64748b" font-size="9">Structured Output &amp; Vision Parsing</text>

    <rect x="15" y="160" width="210" height="45" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="25" y="180" fill="#0f172a" font-size="11" font-weight="600">Deterministic Fallback Parser</text>
    <text x="25" y="195" fill="#64748b" font-size="9">100% Offline Zero-Token Heuristics</text>
  </g>

  <!-- 4. Persistence & Storage Layer -->
  <g transform="translate(670, 380)">
    <rect width="240" height="255" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="240" height="35" rx="8" fill="#dcfce7"/>
    <text x="15" y="23" fill="#166534" font-size="13" font-weight="700">PERSISTENCE &amp; STORAGE</text>

    <rect x="15" y="50" width="210" height="50" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="25" y="70" fill="#0f172a" font-size="11" font-weight="600">SQLAlchemy ORM</text>
    <text x="25" y="87" fill="#64748b" font-size="9">Repository Pattern &amp; Safe Queries</text>

    <rect x="15" y="110" width="210" height="50" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="25" y="130" fill="#0f172a" font-size="11" font-weight="600">SQLite / PostgreSQL Store</text>
    <text x="25" y="147" fill="#64748b" font-size="9">Processed Records, JSON columns</text>

    <rect x="15" y="170" width="210" height="50" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="25" y="190" fill="#0f172a" font-size="11" font-weight="600">Disk Storage (/uploads)</text>
    <text x="25" y="207" fill="#64748b" font-size="9">Document binaries for audit trail</text>
  </g>
</svg>
